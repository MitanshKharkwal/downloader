name: Signed Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          choco install innosetup --no-progress -y
          flutter config --enable-windows-desktop
          Push-Location flutter_ui
          flutter pub get
          Pop-Location

      - name: Test release sources
        shell: pwsh
        run: |
          python -m pytest
          Push-Location flutter_ui
          flutter analyze
          flutter test
          Pop-Location

      - name: Build application
        shell: pwsh
        run: |
          Push-Location flutter_ui
          flutter build windows --release --build-name 1.2.0 --build-number 3
          Pop-Location
          pyinstaller --noconfirm --clean packaging/daemon.spec --distpath packaging/dist --workpath packaging/build
          pyinstaller --noconfirm --clean packaging/native_host.spec --distpath packaging/dist --workpath packaging/build
          pyinstaller --noconfirm --clean packaging/portable.spec --distpath packaging/dist --workpath packaging/build

      - name: Import signing certificate
        id: signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            throw "WINDOWS_CERTIFICATE secret is required for a trusted release"
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "fetchly-signing.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          "certificate_path=$certificatePath" >> $env:GITHUB_OUTPUT

      - name: Sign application binaries
        shell: pwsh
        env:
          CERTIFICATE_PATH: ${{ steps.signing.outputs.certificate_path }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signTool) { throw "SignTool was not found" }
          $targets = @(
            "packaging/dist/downloader-daemon.exe",
            "packaging/dist/downloader-native-host.exe",
            "packaging/dist/register-native-host.exe",
            "packaging/dist/Downloader.exe",
            "flutter_ui/build/windows/x64/runner/Release/flutter_ui.exe"
          )
          foreach ($target in $targets) {
            & $signTool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $env:CERTIFICATE_PATH /p $env:WINDOWS_CERTIFICATE_PASSWORD $target
            if ($LASTEXITCODE -ne 0) { throw "Signing failed for $target" }
          }

      - name: Build and sign installer
        shell: pwsh
        env:
          CERTIFICATE_PATH: ${{ steps.signing.outputs.certificate_path }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          & $signTool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $env:CERTIFICATE_PATH /p $env:WINDOWS_CERTIFICATE_PASSWORD packaging/dist/DownloaderSetup.exe
          if ($LASTEXITCODE -ne 0) { throw "Installer signing failed" }

      - name: Create checksum manifest
        shell: pwsh
        run: |
          $assets = @("packaging/dist/DownloaderSetup.exe", "packaging/dist/Downloader.exe")
          $lines = foreach ($asset in $assets) {
            $hash = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($asset))"
          }
          $lines | Set-Content -Encoding ascii packaging/dist/SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            packaging/dist/DownloaderSetup.exe
            packaging/dist/Downloader.exe
            packaging/dist/SHA256SUMS.txt
