<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: system-ui, sans-serif; width: 280px; padding: 12px; font-size: 13px; }
    h1 { font-size: 14px; margin: 0 0 10px; }
    .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .status { display: flex; align-items: center; gap: 6px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #999; }
    .dot.ok { background: #2ea043; }
    .dot.bad { background: #d1242f; }
    input[type="text"] { width: 100%; box-sizing: border-box; padding: 6px; margin-bottom: 6px; }
    button, select { width: 100%; padding: 7px; cursor: pointer; box-sizing: border-box; }
    .batch { margin-top: 12px; padding-top: 12px; border-top: 1px solid #ddd; }
    .batch select { margin: 6px 0; }
    .muted { color: #666; font-size: 11px; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Download Manager</h1>

  <div class="row">
    <span>Intercept downloads</span>
    <input type="checkbox" id="intercept-toggle">
  </div>

  <div class="row status">
    <span class="dot" id="status-dot"></span>
    <span id="status-text">Checking connection...</span>
  </div>

  <input type="text" id="manual-url" placeholder="Paste a URL or magnet link...">
  <button id="manual-add-btn">Send to Download Manager</button>

  <div class="batch">
    <strong>Download all from this page</strong>
    <select id="batch-filter">
      <option value="all">All links</option>
      <option value="documents">Documents</option>
      <option value="media">Media</option>
      <option value="archives">Archives</option>
      <option value="programs">Programs</option>
    </select>
    <button id="download-all-btn">Find and add links</button>
  </div>

  <div class="muted" id="last-result"></div>

  <script src="popup.js"></script>
</body>
</html>
